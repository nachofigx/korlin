<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Korlin — Aprende jugando</title>
  <link rel="stylesheet" href="learn.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="assets/logo-korlin-white.png" alt="korlin" class="logo">
    </div>
    <div class="hud">
      <span class="hud-item" title="Racha">🔥 <b id="racha">0</b></span>
      <span class="hud-item" title="Puntos">⚡ <b id="xp">0</b></span>
      <span class="hud-item" title="Vidas">❤️ <b id="vidas">3</b></span>
      <span class="lang-switch">
        <button class="langbtn active" data-lang="es">ES</button>
        <button class="langbtn" data-lang="en">EN</button>
      </span>
    </div>
  </header>

  <main>
    <!-- ===== Vista: lista de lecciones ===== -->
    <section id="vista-lecciones" class="vista active">
      <h1 id="titulo-app">Aprende Korlin</h1>
      <p class="sub" id="subtitulo-app">La lengua corta, honesta y moderna. <span class="korlin">ko lin</span></p>
      <div id="lista-lecciones" class="lecciones"></div>
      <button id="btn-conversar" class="btn-conversar">🗣️ Conversar en Korlin</button>
      <button id="btn-flashcards" class="btn-flashcards">🎴 Repasar con flashcards</button>
    </section>

    <!-- ===== Vista: lección (ejercicio) ===== -->
    <section id="vista-leccion" class="vista">
      <div class="leccion-top">
        <button id="btn-salir" class="salir">✕</button>
        <div class="barra"><div id="barra-fill" class="fill"></div></div>
        <span class="vidas-mini" id="vidas-mini">❤️❤️❤️</span>
      </div>
      <div class="mascota-box">
        <img id="mascota-img" src="" alt="mascota" class="mascota">
        <div id="bocadillo" class="bocadillo">¡Vamos!</div>
      </div>
      <div id="ejercicio" class="ejercicio"></div>
    </section>

    <!-- ===== Vista: conversación ===== -->
    <section id="vista-conversar" class="vista">
      <div class="leccion-top">
        <button id="btn-salir-conv" class="salir">✕</button>
        <div class="barra"><div class="fill" style="width:100%"></div></div>
        <span class="vidas-mini">💬</span>
      </div>
      <div class="mascota-box">
        <img id="conv-mascota" src="assets/personajes/pez.jpg" alt="mascota" class="mascota">
        <div id="conv-bocadillo" class="bocadillo">Halo! Mi e-sa Lin.</div>
      </div>
      <p id="conv-traduccion" class="sub"></p>
      <div id="conv-transcripcion" class="transcripcion">Tu respuesta aparecerá aquí…</div>
      <div class="conv-controles">
        <button id="btn-mic" class="btn-mic">🎤</button>
        <button id="btn-escuchar" class="btn-primario">🔊 Escuchar</button>
      </div>
      <p id="conv-pista" class="sub"></p>
    </section>

    <!-- ===== Vista: flashcards ===== -->
    <section id="vista-flashcards" class="vista">
      <div class="leccion-top">
        <button id="btn-salir-flash" class="salir">✕</button>
        <div class="barra"><div class="fill" style="width:100%"></div></div>
        <span class="vidas-mini">🎴</span>
      </div>
      <div class="flash-card" id="flash-card" onclick="voltearFlash()">
        <div class="flash-inner">
          <div class="flash-face flash-front"><span id="flash-frente" class="korlin"></span></div>
          <div class="flash-face flash-back"><span id="flash-reverso"></span></div>
        </div>
      </div>
      <p id="flash-contador" class="sub" style="text-align:center"></p>
      <div class="flash-buttons">
        <button id="flash-btn-no" class="btn-sec">🙈 No la sabía</button>
        <button id="flash-btn-si" class="btn-primario">✅ La sabía</button>
      </div>
    </section>

    <!-- ===== Vista: resultado ===== -->
    <section id="vista-resultado" class="vista">
      <div class="resultado-card">
        <div class="resultado-icono" id="resultado-icono">🏆</div>
        <h2 id="resultado-titulo">¡Lección completada!</h2>
        <p id="resultado-detalle" class="sub"></p>
        <div class="resultado-xp">⚡ +<span id="resultado-xp">20</span> XP</div>
        <button id="btn-continuar" class="btn-primario">Continuar</button>
      </div>
    </section>
  </main>

  <script src="lexico.js"></script>
  <script src="learn.js"></script>
</body>
</html>
