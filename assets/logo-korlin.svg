<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <linearGradient id="gt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c5cff"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
  </defs>

  <!-- icono: squircle con degradado -->
  <rect x="0" y="16" width="100" height="100" rx="26" fill="url(#g)"/>

  <!-- K blanca dentro -->
  <g stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="32" y1="38" x2="32" y2="94"/>
    <line x1="32" y1="62" x2="72" y2="38"/>
    <line x1="32" y1="70" x2="72" y2="94"/>
  </g>
  <!-- punto de "condensación/corto" -->
  <circle cx="72" cy="38" r="5" fill="#ffffff"/>
  <circle cx="72" cy="94" r="5" fill="#ffffff"/>

  <!-- wordmark -->
  <text x="122" y="80" font-family="system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', sans-serif" font-weight="800" font-size="44" fill="url(#gt)" letter-spacing="1">korlin</text>
  <text x="124" y="106" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-weight="600" font-size="12" fill="#8b94a7" letter-spacing="5">SHORTLANG</text>
</svg>
