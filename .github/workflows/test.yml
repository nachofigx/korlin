name: tests

on:
  push:
  pull_request:

jobs:
  korlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install pyyaml
      - name: Fonotáctica
        run: python scripts/test-fonotactica.py
      - name: Regresión
        run: python scripts/test-regresion-v06.py
      - name: Traductor
        run: python scripts/test-traductor.py
